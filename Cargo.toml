[workspace]
resolver = "2"
members = [
    "crates/seo-page",
    "crates/seo-checks",
    "crates/seo-store",
    "crates/seo-render",
    "crates/seo-crawl",
    "crates/seo-server",
    "crates/seo-export",
    "crates/seo-cli",
    "tools/bench-site",
]
# The spike that settled the architecture stays a separate package.
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mimalloc = { version = "0.1", default-features = false }
seo-page = { path = "crates/seo-page" }
seo-checks = { path = "crates/seo-checks" }
seo-store = { path = "crates/seo-store" }
seo-render = { path = "crates/seo-render" }
seo-crawl = { path = "crates/seo-crawl" }
seo-server = { path = "crates/seo-server" }
seo-export = { path = "crates/seo-export" }
# The obscura fork (annel0/obscura, branch fix/chrome-parity) checked out
# next to this repository.
obscura-browser = { path = "../obscura/crates/obscura-browser", features = ["render"] }
obscura-net = { path = "../obscura/crates/obscura-net" }
async-trait = "0.1"
# Same version and features as obscura-net, so both share one build.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "brotli", "deflate", "rustls-tls", "http2", "cookies"] }
texting_robots = "0.2"
encoding_rs = "0.8"
flate2 = "1"
tokio = { version = "1", features = ["full"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema of the crawl settings, for the UI's settings form.
schemars = { version = "1", features = ["url2"] }
anyhow = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
regex = "1"
zstd = "0.13"
toml = "0.8"
rayon = "1"
rustc-hash = "2"
# Attributes kept in source order, so extracted HTML reads as written.
scraper = { version = "0.20", features = ["deterministic"] }
# scraper's tree, to walk a document's nodes (the same version as scraper's).
# XPath 1.0 for custom extraction, evaluated on a copy of the scraper DOM.
sxd-document = "0.3"
sxd-xpath = "0.4"
lol_html = "2"
htmlize = { version = "1", features = ["unescape"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rust_xlsxwriter = { version = "0.79", features = ["constant_memory"] }
csv = "1"
# The web UI server.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
# Database servers for crawls: PostgreSQL and MySQL, TLS on ring like reqwest.
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
futures-executor = "0.3"
bytes = "1"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "buffer-pool", "rustls-tls-ring"] }
rust-embed = "8"
mime_guess = "2"

# obscura pins two crates to its vendored copies; every workspace that builds
# obscura must repeat the patches or it compiles against the upstream crates.
[patch.crates-io]
taffy = { path = "../obscura/vendor/taffy" }
cosmic-text = { path = "../obscura/vendor/cosmic-text" }

# obscura's ops rely on unwinding to turn panics into errors instead of
# aborting inside V8 frames.
[profile.release]
panic = "unwind"
