[package]
name = "seo-server"
description = "Web UI server: starts and steers crawls, streams their progress, serves their tables"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Build the UI into the binary (needs ui/dist from `npm run build`); without
# it the server reads the UI from a directory at run time.
embed-ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
seo-page = { workspace = true }
seo-store = { workspace = true }
seo-checks = { workspace = true }
seo-crawl = { workspace = true }
seo-export = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
csv = { workspace = true }
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
