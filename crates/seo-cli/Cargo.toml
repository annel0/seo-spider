[package]
name = "seo-cli"
description = "seo-spider command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "seo-spider"
path = "src/main.rs"

[features]
# The web UI inside the binary (build ui/ first).
embed-ui = ["seo-server/embed-ui"]

[dependencies]
seo-page = { workspace = true }
seo-crawl = { workspace = true }
seo-store = { workspace = true }
seo-checks = { workspace = true }
seo-server = { workspace = true }
seo-export = { workspace = true }
rayon = { workspace = true }
mimalloc = { workspace = true }
rustc-hash = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
csv = { workspace = true }
toml = { workspace = true }
zstd = { workspace = true }
